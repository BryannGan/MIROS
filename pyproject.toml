[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miros"
version = "0.2.0.dev0"
description = "Medical Image to Patient-Specific Reduced-Order Hemodynamic Model Simulation in Minutes"
readme = "README.md"
requires-python = ">=3.10"           # 3.9 is end of life; its last vtk/pyvista wheels crash under Qt
license = { text = "MIT" }
authors = [{ name = "Bryan Gan" }]
keywords = ["hemodynamics", "cardiovascular", "reduced-order model", "0D", "1D", "simvascular",
            "svzerodsolver", "svonedsolver", "seqseg", "segmentation", "vtk", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/BryannGan/MIROS"
Documentation = "https://github.com/BryannGan/MIROS/blob/main/docs/install.md"
Issues = "https://github.com/BryannGan/MIROS/issues"
"Prebuilt solvers" = "https://github.com/BryannGan/MIROS/releases/tag/solvers"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "vtk>=9",
    "pyvista>=0.43",
    "PyYAML",
    "pwlf",
    "pyacvd",
    "tetgen",
    "rich",
    "ruamel.yaml",
]
# The 0D solver (pysvzerod) is installed from git until wheels are published:
#   pip install git+https://github.com/simvascular/svZeroDSolver.git
# The 1D solver (svOneDSolver) is an executable; see `miros doctor`.

[project.optional-dependencies]
gui = ["pyvistaqt", "PySide6"]       # `miros gui` (3D view + steps)
seg = ["seqseg>=2.1", "SimpleITK"]   # segmentation from images (pulls nnunetv2 + torch)
all = ["pyvistaqt", "PySide6", "seqseg>=2.1", "SimpleITK"]
dev = ["pytest", "pyvistaqt", "PySide6"]

[project.scripts]
miros = "miros.cli:main"

[tool.setuptools.packages.find]
include = ["miros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["manual"]           # tests/manual are scripts that need a window or a real segmentation
markers = ["slow: takes more than a few seconds"]
