name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Everything that needs no solver, on the three operating systems and at both ends
# of the supported Python range (3.10 to 3.12): the unit tests including the window (offscreen),
# the geometry and ROM builder against the SimVascular reference, and the CLI from
# a surface to the 0D model. pysvzerod and OneDSolver are not installed here, so
# the tests that solve are skipped.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt and OpenGL libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xinerama0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Doctor
        run: python -m miros doctor
      - name: Unit tests, window included
        run: python -m pytest tests/unit -q
      - name: Integration tests (the solvers are absent, so those skip)
        run: python -m pytest tests/integration -q
      - name: The CLI, from a surface to the 0D model
        shell: bash
        run: |
          python -m miros init "${{ runner.temp }}/aorta" --surface examples/aorta/clipped_seqseg_results.vtp --inflow examples/aorta/inflow.flow
          python -m miros run "${{ runner.temp }}/aorta" --until rom_model
          python -m miros status "${{ runner.temp }}/aorta"
