name: publish

# A tag v1.2.3 builds the sdist and wheel, checks them, and uploads them to PyPI
# through trusted publishing (no token in the repository: PyPI trusts this
# workflow in the `pypi` environment; set that up once under the project's
# "Publishing" settings on pypi.org). A manual run only builds and checks.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          ls -la dist
      - name: The wheel installs on its own
        run: |
          python -m venv /tmp/fresh && /tmp/fresh/bin/pip install -q dist/*.whl && /tmp/fresh/bin/miros --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
